name: CI Pipeline — GuardIA Parto Seguro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # JOB 1: LINT & FORMAT CHECK
  # ============================================================
  lint:
    name: "🔍 Lint (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - video-domain
          - audio-domain
          - document-domain
          - risk-domain
          - report-domain
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install lint tools
        run: pip install ruff black

      - name: Run ruff (linting + isort)
        run: ruff check ${{ matrix.service }}/ --output-format=github

      - name: Run black (format check)
        run: black --check --diff ${{ matrix.service }}/

  # ============================================================
  # JOB 2: UNIT TESTS
  # ============================================================
  test:
    name: "🧪 Tests (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - video-domain
          - audio-domain
          - document-domain
          - risk-domain
          - report-domain
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardia_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: guardia_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://guardia_test:test_password@localhost:5432/guardia_test
          SECRET_KEY: ci_test_secret_key_not_for_production
          TESTING: "true"
          AZURE_SPEECH_KEY: mock_key
          AZURE_LANGUAGE_KEY: mock_key
          AZURE_DOC_INTELLIGENCE_KEY: mock_key
          AZURE_BLOB_CONNECTION_STRING: "UseDevelopmentStorage=true"
        run: |
          cd ${{ matrix.service }}
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v \
            --tb=short

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage
          fail_ci_if_error: false

  # ============================================================
  # JOB 3: SECURITY SCAN
  # ============================================================
  security:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit SAST
        run: |
          bandit -r backend/ video-domain/ audio-domain/ document-domain/ risk-domain/ report-domain/ frontend/ \
            -ll \
            --format json \
            --output bandit-results.json \
            --exclude "**/tests/**,**/.venv/**" || true
          python -c "
          import json, sys
          with open('bandit-results.json') as f:
            data = json.load(f)
          high = [i for i in data['results'] if i['issue_severity'] == 'HIGH']
          if high:
            print(f'❌ {len(high)} HIGH severity issues found:')
            for i in high: print(f'  - {i[\"filename\"]}:{i[\"line_number\"]} — {i[\"issue_text\"]}')
            sys.exit(1)
          else:
            print(f'✅ No HIGH severity issues. Total issues: {len(data[\"results\"])}')
          "

      - name: Check for known vulnerabilities
        run: |
          for service in backend video-domain audio-domain document-domain risk-domain report-domain frontend; do
            if [ -f "$service/requirements.txt" ]; then
              echo "Checking $service..."
              safety check -r $service/requirements.txt --short-report || echo "⚠️ Vulnerabilities found in $service"
            fi
          done

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-results.json

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ============================================================
  # JOB 4: DOCKER BUILD
  # ============================================================
  build:
    name: "🐳 Build (${{ matrix.service.name }})"
    runs-on: ubuntu-latest
    needs: [test, security]
    strategy:
      fail-fast: false
      matrix:
        service:
          - {name: backend, port: 8000}
          - {name: video-domain, port: 8001}
          - {name: audio-domain, port: 8002}
          - {name: document-domain, port: 8003}
          - {name: risk-domain, port: 8004}
          - {name: report-domain, port: 8005}
          - {name: frontend, port: 8501}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.name }}
          push: false
          tags: |
            guardia/${{ matrix.service.name }}:${{ github.sha }}
            guardia/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ============================================================
  # RESUMO FINAL
  # ============================================================
  ci-summary:
    name: "✅ CI Summary"
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ CI Failed — check individual job results above"
            exit 1
          fi
          echo "✅ All CI jobs passed successfully!"
