# =============================================================
# GuardIA Parto Seguro — Docker Compose
# Localizado em: infra/docker-compose.yml
# Executar a partir da raiz com: docker-compose -f infra/docker-compose.yml up -d
# Ou usar o script: ./start.sh  |  .\start.ps1
# =============================================================

version: "3.9"

# --------------- VOLUMES PERSISTENTES ----------------
volumes:
  postgres_core_data:
  postgres_domains_data:
  redis_data:

# --------------- REDES INTERNAS ----------------------
networks:
  guardia_net:
    driver: bridge

# --------------- SERVIÇOS ----------------------------
services:

  # =====================================================
  # INFRAESTRUTURA
  # =====================================================

  # --- PostgreSQL: core_db (auth, sessões, alertas) ---
  postgres-core:
    image: postgres:16-alpine
    container_name: guardia-postgres-core
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-guardia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-guardia_dev_pass}
      POSTGRES_DB: core_db
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    networks:
      - guardia_net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-guardia} -d core_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- PostgreSQL: bancos de domínio (video, audio, document, risk, report) ---
  postgres-domains:
    image: postgres:16-alpine
    container_name: guardia-postgres-domains
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-guardia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-guardia_dev_pass}
      POSTGRES_DB: video_db
    volumes:
      - postgres_domains_data:/var/lib/postgresql/data
      - ./postgres/init-domains.sql:/docker-entrypoint-initdb.d/init-domains.sql:ro
    networks:
      - guardia_net
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-guardia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Redis: cache e filas de sessão ---
  redis:
    image: redis:7-alpine
    container_name: guardia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-guardia_redis_pass}
    volumes:
      - redis_data:/data
    networks:
      - guardia_net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-guardia_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # CORE PLATFORM (Dev 1) — backend/
  # =====================================================
  core-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: guardia-core-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-core:5432/core_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-guardia_redis_pass}@redis:6379/0
      VIDEO_SERVICE_URL: http://video-service:8001
      AUDIO_SERVICE_URL: http://audio-service:8002
      DOCUMENT_SERVICE_URL: http://document-service:8003
      RISK_SERVICE_URL: http://risk-service:8004
      REPORT_SERVICE_URL: http://report-service:8005
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    networks:
      - guardia_net
    depends_on:
      postgres-core:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # VIDEO DOMAIN (Dev 2) — video-domain/
  # =====================================================
  video-service:
    build:
      context: ../video-domain
      dockerfile: Dockerfile
      target: development
    container_name: guardia-video-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-domains:5432/video_db
      SERVICE_PORT: "8001"
      VIDEO_FRAME_SAMPLE_RATE: ${VIDEO_FRAME_SAMPLE_RATE:-1.0}
      DEEPFACE_BACKEND: ${DEEPFACE_BACKEND:-retinaface}
      YOLO_CONFIDENCE_THRESHOLD: ${YOLO_CONFIDENCE_THRESHOLD:-0.70}
    volumes:
      - ../video-domain:/app
    ports:
      - "8001:8001"
    networks:
      - guardia_net
    depends_on:
      postgres-domains:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # =====================================================
  # AUDIO DOMAIN (Dev 2) — audio-domain/
  # =====================================================
  audio-service:
    build:
      context: ../audio-domain
      dockerfile: Dockerfile
      target: development
    container_name: guardia-audio-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-domains:5432/audio_db
      SERVICE_PORT: "8002"
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-brazilsouth}
      AZURE_SPEECH_LANGUAGE: ${AZURE_SPEECH_LANGUAGE:-pt-BR}
      AZURE_LANGUAGE_ENDPOINT: ${AZURE_LANGUAGE_ENDPOINT:-}
      AZURE_LANGUAGE_KEY: ${AZURE_LANGUAGE_KEY:-}
    volumes:
      - ../audio-domain:/app
    ports:
      - "8002:8002"
    networks:
      - guardia_net
    depends_on:
      postgres-domains:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # DOCUMENT DOMAIN (Dev 3) — document-domain/
  # =====================================================
  document-service:
    build:
      context: ../document-domain
      dockerfile: Dockerfile
      target: development
    container_name: guardia-document-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-domains:5432/document_db
      SERVICE_PORT: "8003"
      AZURE_DOC_INTELLIGENCE_ENDPOINT: ${AZURE_DOC_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOC_INTELLIGENCE_KEY: ${AZURE_DOC_INTELLIGENCE_KEY:-}
    volumes:
      - ../document-domain:/app
    ports:
      - "8003:8003"
    networks:
      - guardia_net
    depends_on:
      postgres-domains:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # RISK DOMAIN (Dev 3) — risk-domain/
  # =====================================================
  risk-service:
    build:
      context: ../risk-domain
      dockerfile: Dockerfile
      target: development
    container_name: guardia-risk-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-domains:5432/risk_db
      SERVICE_PORT: "8004"
      IRA_WEIGHT_VIDEO: ${IRA_WEIGHT_VIDEO:-0.40}
      IRA_WEIGHT_AUDIO: ${IRA_WEIGHT_AUDIO:-0.35}
      IRA_WEIGHT_DOCUMENT: ${IRA_WEIGHT_DOCUMENT:-0.25}
      IRA_THRESHOLD_MODERATE: ${IRA_THRESHOLD_MODERATE:-40.0}
      IRA_THRESHOLD_CRITICAL: ${IRA_THRESHOLD_CRITICAL:-70.0}
    volumes:
      - ../risk-domain:/app
    ports:
      - "8004:8004"
    networks:
      - guardia_net
    depends_on:
      postgres-domains:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # REPORT DOMAIN (Dev 4) — report-domain/
  # =====================================================
  report-service:
    build:
      context: ../report-domain
      dockerfile: Dockerfile
      target: development
    container_name: guardia-report-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-domains:5432/report_db
      SERVICE_PORT: "8005"
      AZURE_BLOB_CONNECTION_STRING: ${AZURE_BLOB_CONNECTION_STRING:-}
      AZURE_BLOB_CONTAINER_REPORTS: ${AZURE_BLOB_CONTAINER_REPORTS:-guardia-reports}
    volumes:
      - ../report-domain:/app
    ports:
      - "8005:8005"
    networks:
      - guardia_net
    depends_on:
      postgres-domains:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # FRONTEND — Streamlit Dashboard (Dev 4) — frontend/
  # =====================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: guardia-frontend
    restart: unless-stopped
    env_file: ../.env
    environment:
      API_BASE_URL: http://core-api:8000
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_THEME: ${STREAMLIT_THEME:-dark}
    volumes:
      - ../frontend:/app
    ports:
      - "8501:8501"
    networks:
      - guardia_net
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
