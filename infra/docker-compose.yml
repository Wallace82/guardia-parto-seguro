# =============================================================
# GuardIA Parto Seguro — Docker Compose
# Localizado em: infra/docker-compose.yml
# Executar a partir da raiz com: docker-compose -f infra/docker-compose.yml up -d
# Ou usar o script: ./start.sh  |  .\start.ps1
# =============================================================

# version está obsoleto no Docker Compose V2

# --------------- VOLUMES PERSISTENTES ----------------
volumes:
  postgres_core_data:
  redis_data:
  shared_media_data:

# --------------- REDES INTERNAS ----------------------
networks:
  guardia_net:
    driver: bridge

# --------------- SERVIÇOS ----------------------------
services:

  # =====================================================
  # INFRAESTRUTURA
  # =====================================================

  # --- PostgreSQL: core_db (auth, sessões, alertas) ---
  postgres-core:
    image: postgres:16-alpine
    container_name: guardia-postgres-core
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-guardia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-guardia_dev_pass}
      POSTGRES_DB: core_db
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    networks:
      - guardia_net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-guardia} -d core_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s



  # --- Redis: cache e filas de sessão ---
  redis:
    image: redis:7-alpine
    container_name: guardia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-guardia_redis_pass}
    volumes:
      - redis_data:/data
    networks:
      - guardia_net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-guardia_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # CORE PLATFORM (Wallace Gomes - Dev 1) — backend/
  # =====================================================
  core-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: guardia-core-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-core:5432/core_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-guardia_redis_pass}@redis:6379/0
      VIDEO_SERVICE_URL: http://video-service:8001
      AUDIO_SERVICE_URL: http://audio-service:8002
      DOCUMENT_SERVICE_URL: http://document-service:8003
      RISK_SERVICE_URL: http://risk-service:8004
      REPORT_SERVICE_URL: http://report-service:8005
      SHARED_MEDIA_DIR: /shared_media
    volumes:
      - ../backend:/app
      - shared_media_data:/shared_media
    ports:
      - "8000:8000"
    networks:
      - guardia_net
    depends_on:
      postgres-core:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # VIDEO DOMAIN (Paulo Roberto Gonçalves - Dev 2) — video-domain/
  # =====================================================
  video-service:
    build:
      context: ../video-domain
      dockerfile: Dockerfile
      target: development
    container_name: guardia-video-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-core:5432/core_db
      SERVICE_PORT: "8001"
      VIDEO_FRAME_SAMPLE_RATE: ${VIDEO_FRAME_SAMPLE_RATE:-1.0}
      DEEPFACE_BACKEND: ${DEEPFACE_BACKEND:-retinaface}
      YOLO_CONFIDENCE_THRESHOLD: ${YOLO_CONFIDENCE_THRESHOLD:-0.70}
      SHARED_MEDIA_DIR: /shared_media
    volumes:
      - ../video-domain:/app
      - shared_media_data:/shared_media
    ports:
      - "8001:8001"
    networks:
      - guardia_net
    depends_on:
      postgres-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # =====================================================
  # AUDIO DOMAIN (Paulo Roberto Gonçalves - Dev 2) — audio-domain/
  # =====================================================
  audio-service:
    build:
      context: ../audio-domain
      dockerfile: Dockerfile
      target: development
    container_name: guardia-audio-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-core:5432/core_db
      SERVICE_PORT: "8002"
      SHARED_MEDIA_DIR: /shared_media
    volumes:
      - ../audio-domain:/app
      - shared_media_data:/shared_media
    ports:
      - "8002:8002"
    networks:
      - guardia_net
    depends_on:
      postgres-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # DOCUMENT DOMAIN (Evandro Rosa Sampaio - Dev 3) — document-domain/
  # =====================================================
  document-service:
    build:
      context: ../document-domain
      dockerfile: Dockerfile
      target: development
    container_name: guardia-document-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-core:5432/core_db
      SERVICE_PORT: "8003"
      SHARED_MEDIA_DIR: /shared_media
    volumes:
      - ../document-domain:/app
      - shared_media_data:/shared_media
    ports:
      - "8003:8003"
    networks:
      - guardia_net
    depends_on:
      postgres-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/documents/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # RISK DOMAIN (Evandro Rosa Sampaio - Dev 3) — risk-domain/
  # =====================================================
  risk-service:
    build:
      context: ../risk-domain
      dockerfile: Dockerfile
      target: development
    container_name: guardia-risk-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-core:5432/core_db
      SERVICE_PORT: "8004"
      IRA_WEIGHT_VIDEO: ${IRA_WEIGHT_VIDEO:-0.40}
      IRA_WEIGHT_AUDIO: ${IRA_WEIGHT_AUDIO:-0.35}
      IRA_WEIGHT_DOCUMENT: ${IRA_WEIGHT_DOCUMENT:-0.25}
      IRA_THRESHOLD_MODERATE: ${IRA_THRESHOLD_MODERATE:-40.0}
      IRA_THRESHOLD_CRITICAL: ${IRA_THRESHOLD_CRITICAL:-70.0}
    volumes:
      - ../risk-domain:/app
    ports:
      - "8004:8004"
    networks:
      - guardia_net
    depends_on:
      postgres-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/v1/risk/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # REPORT DOMAIN (Gustavo Octaviano - Dev 4) — report-domain/
  # =====================================================
  report-service:
    build:
      context: ../report-domain
      dockerfile: Dockerfile
      target: development
    container_name: guardia-report-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-core:5432/core_db
      SERVICE_PORT: "8005"
    volumes:
      - ../report-domain:/app
    ports:
      - "8005:8005"
    networks:
      - guardia_net
    depends_on:
      postgres-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/api/v1/reports/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # AWS DOMAIN (Wallace Gomes - Dev 5) — aws-domain/
  # =====================================================
  aws-service:
    build:
      context: ../aws-domain
      dockerfile: Dockerfile
      target: development
    container_name: guardia-aws-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      SERVICE_PORT: "8007"
      MEDIA_BUCKET_NAME: ${MEDIA_BUCKET_NAME:-guardia-parto-seguro-media-dev-foton}
      REPORTS_BUCKET_NAME: ${REPORTS_BUCKET_NAME:-guardia-parto-seguro-reports-dev-foton}
    volumes:
      - ../aws-domain:/app
    ports:
      - "8007:8007"
    networks:
      - guardia_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # SECURITY DOMAIN (Wallace Gomes - Dev 5) — security-domain/
  # =====================================================
  security-service:
    build:
      context: ../security-domain
      dockerfile: Dockerfile
      target: development
    container_name: guardia-security-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-guardia}:${DB_PASSWORD:-guardia_dev_pass}@postgres-core:5432/core_db
      SERVICE_PORT: "8006"
    volumes:
      - ../security-domain:/app
    ports:
      - "8006:8006"
    networks:
      - guardia_net
    depends_on:
      postgres-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


